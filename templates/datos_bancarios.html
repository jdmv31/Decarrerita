<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Datos Bancarios</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="contenedor">
        <h1>Datos Bancarios</h1>
        <p style="font-size: 0.9em; color: #555;">Ingrese sus datos bancarios</p>

        <form action="/chofer/datos-bancarios" method="POST">
            <input type="hidden" name="id_chofer" value="{{ id_chofer }}">
            <select name="banco" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="" disabled selected>Seleccione su banco</option>
                <option value="Bancamiga">0172 - Bancamiga</option>
                <option value="Bancaribe">0114 - Bancaribe</option>
                <option value="Banco Activo">0171 - Banco Activo</option>
                <option value="Banco Agrícola de Venezuela">0166 - Banco Agrícola de Venezuela</option>
                <option value="Banco Bicentenario">0175 - Banco Bicentenario</option>
                <option value="Banco Caroní">0128 - Banco Caroní</option>
                <option value="Banco de Venezuela">0102 - Banco de Venezuela</option>
                <option value="Banco Venezolano de Crédito">0104 - Banco Venezolano de Crédito</option>
                <option value="Bancrecer">0168 - Bancrecer</option>
                <option value="Banesco">0134 - Banesco</option>
                <option value="Banco Nacional de Crédito">0191 - Banco Nacional de Crédito</option>
                <option value="Banco Plaza">0138 - Banco Plaza</option>
                <option value="Banco Provincial">0108 - Banco Provincial</option>
                <option value="Del Sur">0157 - Del Sur</option>
                <option value="Mercantil">0105 - Mercantil</option>
                <option value="Tesoro">0163 - Tesoro</option>
            </select>
            <input type="number" name="numero_cuenta" placeholder="Ej: 1234567890" required>
            <button type="submit" style="margin-top: 15px;">Registrar Datos</button>
        </form>

        <a href="/panel-chofer" style="display: block; margin-top: 15px; text-decoration: none; color: #6c757d; font-size: 0.9em;">
            Cancelar y Volver
        </a>
    </div>
</body>
</html>
