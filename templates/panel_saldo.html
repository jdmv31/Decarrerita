{% extends "base.html" %}

{% block title %}Gestionar Saldo{% endblock %}

{% block content %}
    <div class="contenedor" style="width: 350px;">
        <h1>Billetera</h1>
        
        <div style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-size: 0.95em; text-align: center; border: 1px solid #c3e6cb;">
            <p style="margin: 0;"><strong>Saldo Disponible:</strong> <br> <span style="font-size: 1.5em; font-weight: bold;">${{ saldo }}</span></p>
        </div>
        
        <h3 style="text-align: left; margin-bottom: 10px;">Acciones</h3>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a href="/pasajero/saldo/recargar?id_pasajero={{ id_pasajero }}">
                <button style="width: 100%; background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">
                    Recargar Saldo
                </button>
            </a>
            
            <a href="/pasajero/saldo/historial?id_pasajero={{ id_pasajero }}">
                <button style="width: 100%; padding: 10px; border-radius: 4px; cursor: pointer;">
                    Historial de Recargas
                </button>
            </a>
        </div>

        <a href="/panel-pasajero?id_pasajero={{ id_pasajero }}" style="display: block; margin-top: 25px; text-decoration: none; color: #6c757d; font-size: 0.9em; font-weight: bold;">
            Volver al Panel Principal
        </a>
    </div>
{% endblock %}
