{% extends "base.html" %}

{% block title %}Registrar Personal - Decarrerita{% endblock %}

{% block content %}
    <div class="contenedor" style="width: 400px;">
        <h1>Registrar Personal</h1>
        <p style="color: #555; margin-bottom: 20px;">Ingresa los datos del nuevo miembro del equipo administrativo.</p>

        <div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px; text-align: left; border: 1px solid #dee2e6;">
            <form action="/administracion/administradores/agregar" method="POST">
                <input type="hidden" name="rol_creador" value="{{ rol }}">
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #333;">Nombre:</label>
                <input type="text" name="nombre" placeholder="Ej: Carlos" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">

                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #333;">Apellido:</label>
                <input type="text" name="apellido" placeholder="Ej: Mendoza" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #333;">Cédula:</label>
                <input type="number" name="cedula" placeholder="Ej: 12345678" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #333;">Dirección (Estado):</label>
                <select name="direccion" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; background-color: white;">
                    <option value="" disabled>Selecciona tu estado</option>
                    <option value="Amazonas">Amazonas</option>
                    <option value="Anzoátegui">Anzoátegui</option>
                    <option value="Apure">Apure</option>
                    <option value="Aragua">Aragua</option>
                    <option value="Barinas">Barinas</option>
                    <option value="Bolívar" selected>Bolívar</option>
                    <option value="Carabobo">Carabobo</option>
                    <option value="Cojedes">Cojedes</option>
                    <option value="Delta Amacuro">Delta Amacuro</option>
                    <option value="Distrito Capital">Distrito Capital</option>
                    <option value="Falcón">Falcón</option>
                    <option value="Guárico">Guárico</option>
                    <option value="Lara">Lara</option>
                    <option value="Mérida">Mérida</option>
                    <option value="Miranda">Miranda</option>
                    <option value="Monagas">Monagas</option>
                    <option value="Nueva Esparta">Nueva Esparta</option>
                    <option value="Portuguesa">Portuguesa</option>
                    <option value="Sucre">Sucre</option>
                    <option value="Táchira">Táchira</option>
                    <option value="Trujillo">Trujillo</option>
                    <option value="La Guaira">La Guaira</option>
                    <option value="Yaracuy">Yaracuy</option>
                    <option value="Zulia">Zulia</option>
                </select>
                
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #333;">Correo Electrónico:</label>
                <input type="email" name="correo" placeholder="ejemplo@carrerita.com" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #333;">Contraseña temporal:</label>
                <input type="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #333;">Rol a asignar:</label>
                <select name="rol" required style="width: 100%; padding: 10px; margin-bottom: 25px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; background-color: white;">
                    {% if rol == 'superadmin' %}
                        <option value="admin">Administrador</option>
                        <option value="superadmin">Super Administrador</option>
                    {% else %}
                        <option value="admin" selected>Administrador</option>
                    {% endif %}
                </select>
                
                <button type="submit" style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em;">
                    Registrar Personal
                </button>
            </form>
        </div>

        <a href="/panel-administracion?rol={{rol}}" style="display: block; margin-top: 20px; text-decoration: none; color: #dc3545; font-size: 0.9em; font-weight: bold;">
            Cancelar y Volver al Panel
        </a>
    </div>
{% endblock %}
