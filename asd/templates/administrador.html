{% extends "base.html" %}

{% block title %}Registrar Personal - Decarrerita{% endblock %}

{% block content %}
<div class="dashboard-container">
    
    <!-- PANEL LATERAL -->
    <aside class="panel-izquierdo">
        <div class="perfil-header">
            <div class="avatar-placeholder">
                <img src="{{ url_for('static', path='images/usuario.png') }}" alt="Admin">
            </div>
            <h1>Gestión</h1>
        </div>
        <nav class="menu-lateral">
            <a href="/panel-administracion?rol={{ rol }}&id_admin={{ id_admin }}" class="menu-item">⬅ Volver al Panel</a>
            <a href="/administracion/personal?rol={{ rol }}&id_admin={{ id_admin }}" class="menu-item">Promover Personal</a>
            <!-- Opción activa -->
            <a href="/administracion/administradores?rol={{ rol }}&id_admin={{ id_admin }}" class="menu-item" style="background-color: rgba(255, 255, 255, 0.1); color: #ffffff;">➕ Agregar Personal</a>
        </nav>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="panel-derecho">
        
        <header class="header-principal">
            <h2>Registrar Nuevo Personal</h2>
            <p>Ingresa los datos del nuevo miembro del equipo administrativo.</p>
        </header>

        <div class="tarjeta-formulario">
            <form action="/administracion/administradores/agregar" method="POST" class="formulario-estilizado">
                <input type="hidden" name="rol_creador" value="{{ rol }}">
                <input type="hidden" name="id_admin" value="{{ id_admin }}">
                
                <div class="grupo-input">
                    <label>Nombre:</label>
                    <input type="text" name="nombre" placeholder="Ej: Carlos" required>
                </div>
                
                <div class="grupo-input">
                    <label>Apellido:</label>
                    <input type="text" name="apellido" placeholder="Ej: Mendoza" required>
                </div>

                <div class="grupo-input">
                    <label>Cédula:</label>
                    <input type="number" name="cedula" placeholder="Ej: 12345678" required>
                </div>

                <div class="grupo-input">
                    <label>Dirección (Estado):</label>
                    <select name="direccion" required>
                        <option value="" disabled>Selecciona tu estado</option>
                        <option value="Amazonas">Amazonas</option>
                        <option value="Anzoátegui">Anzoátegui</option>
                        <option value="Apure">Apure</option>
                        <option value="Aragua">Aragua</option>
                        <option value="Barinas">Barinas</option>
                        <option value="Bolívar" selected>Bolívar</option>
                        <option value="Carabobo">Carabobo</option>
                        <option value="Cojedes">Cojedes</option>
                        <option value="Delta Amacuro">Delta Amacuro</option>
                        <option value="Distrito Capital">Distrito Capital</option>
                        <option value="Falcón">Falcón</option>
                        <option value="Guárico">Guárico</option>
                        <option value="Lara">Lara</option>
                        <option value="Mérida">Mérida</option>
                        <option value="Miranda">Miranda</option>
                        <option value="Monagas">Monagas</option>
                        <option value="Nueva Esparta">Nueva Esparta</option>
                        <option value="Portuguesa">Portuguesa</option>
                        <option value="Sucre">Sucre</option>
                        <option value="Táchira">Táchira</option>
                        <option value="Trujillo">Trujillo</option>
                        <option value="La Guaira">La Guaira</option>
                        <option value="Yaracuy">Yaracuy</option>
                        <option value="Zulia">Zulia</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label>Correo Electrónico:</label>
                    <input type="email" name="correo" placeholder="ejemplo@carrerita.com" required>
                </div>

                <div class="grupo-input">
                    <label>Contraseña temporal:</label>
                    <input type="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <!-- Esta columna ocupa todo el ancho inferior -->
                <div class="grupo-input" style="grid-column: span 2;">
                    <label>Rol a asignar:</label>
                    <select name="rol" required>
                        {% if rol == 'superadmin' %}
                            <option value="admin">Administrador</option>
                            <option value="superadmin">Super Administrador</option>
                        {% else %}
                            <option value="admin" selected>Administrador</option>
                        {% endif %}
                    </select>
                </div>

                <button type="submit" class="btn-principal btn-verde btn-submit-form">
                    Registrar Personal
                </button>
            </form>
        </div>
    </main>
</div>
{% endblock %}
