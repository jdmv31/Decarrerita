<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Decarrerita{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=3.0">
</head>
<body class="{% block body_class %}{% endblock %}">
    <main>
        {% block content %}
        {% endblock %}
    </main>
<script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idChofer = urlParams.get('id_chofer');

            if (idChofer) {
                let temporizadorInactividad;
                let estadoActualChofer = "DESCONECTADO"; 

                function forzarDesconexion() {
                    if (estadoActualChofer === "DISPONIBLE") {
                        let datos = new FormData();
                        datos.append("id_chofer", idChofer);
                        datos.append("estado_nuevo", "DESCONECTADO");

                        fetch('/chofer/estado', {
                            method: 'POST',
                            body: datos
                        }).then(() => {
                            alert("Has sido marcado como DESCONECTADO por 5 minutos de inactividad.");
                            window.location.href = `/panel-chofer?id_chofer=${idChofer}`;
                        });
                    } else {
                        reiniciarTimer();
                    }
                }

                function reiniciarTimer() {
                    clearTimeout(temporizadorInactividad);
                    temporizadorInactividad = setTimeout(forzarDesconexion, 300000);
                }

                reiniciarTimer();

                document.addEventListener("mousemove", reiniciarTimer);
                document.addEventListener("keypress", reiniciarTimer);
                document.addEventListener("scroll", reiniciarTimer);
                document.addEventListener("click", reiniciarTimer);

                if (!window.location.href.includes("chofer/aceptar-viaje") && !window.location.href.includes("chofer/viaje-actual")) {
                    setInterval(() => {
                        fetch(`/api/chofer/verificar-viaje/${idChofer}`)
                            .then(response => response.json())
                            .then(data => {
                                
                                // NUEVO: Actualizamos la variable con el estado real de la base de datos
                                if (data.estado_chofer) {
                                    estadoActualChofer = data.estado_chofer;
                                }

                                if (data.viaje_pendiente) {
                                    window.location.href = `/chofer/aceptar-viaje?id_chofer=${idChofer}&id_viaje=${data.id_viaje}`;
                                }
                            })
                            .catch(err => console.error("Error en el radar del chofer:", err));
                    }, 5000); 
                }
            }
        });
    </script>
</body>
</html>
