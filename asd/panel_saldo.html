{% extends "base.html" %}

{% block title %}Decarrerita - Gestionar Saldo{% endblock %}

{% block content %}
<div class="dashboard-container">
    
    <aside class="panel-izquierdo">
        <div class="perfil-header">
            <div class="avatar-placeholder">
                <img src="{{ url_for('static', path='images/usuario.png') }}" alt="Foto de perfil">
            </div>
            <h1>Billetera</h1>
        </div>
        
        <nav class="menu-lateral">
            <a href="/panel-pasajero?id_pasajero={{ id_pasajero }}" class="menu-item">← Volver al Panel</a>
        </nav>
    </aside>

    <main class="panel-derecho">
        
        <header class="header-principal">
            <h2>Gestión de Saldo</h2>
            <p>Controla tu dinero y revisa tus movimientos</p>
        </header>

        <div class="grid-tarjetas">
            <div class="tarjeta-dato saldo-card">
                <h3>Saldo Disponible</h3>
                <p class="valor">${{ saldo }}</p>
            </div>
        </div>

        <div class="acciones-billetera">
            <h3 class="titulo-seccion">Acciones Rápidas</h3>
            
            <div class="grupo-botones-der" style="display: flex; gap: 15px;">
                <a href="/pasajero/saldo/recargar?id_pasajero={{ id_pasajero }}">
                    <button class="btn-principal btn-verde">Recargar Saldo</button>
                </a>
                
                <a href="/pasajero/saldo/historial?id_pasajero={{ id_pasajero }}">
                    <button class="btn-principal">Historial de Recargas</button>
                </a>
            </div>
        </div>

    </main>
</div>
{% endblock %}
